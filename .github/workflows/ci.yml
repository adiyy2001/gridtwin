name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Style gate tests
        run: node --test tools/
      - name: Style gate
        run: node tools/check-style.mjs

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Format, lint, tests and coverage
        run: ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'

  changes:
    runs-on: ubuntu-latest
    outputs:
      references: ${{ steps.filter.outputs.references }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          paths=(tools/reference/ cases/src/main/resources/cases/ validation/src/test/resources/reference/)
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "references=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE" HEAD -- "${paths[@]}"; then
            echo "references=false" >> "$GITHUB_OUTPUT"
          else
            echo "references=true" >> "$GITHUB_OUTPUT"
          fi

  references:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.references == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Regenerate the references and compare them with the committed files
        run: tools/reference/run.sh --check all
