quarkus.http.host=127.0.0.1
quarkus.http.port=18480
quarkus.http.test-port=0
quarkus.jackson.serialization-inclusion=non-absent
quarkus.http.limits.max-body-size=64K
quarkus.smallrye-openapi.info-title=gridtwin API
quarkus.smallrye-openapi.info-version=0.1.0
quarkus.smallrye-openapi.info-description=Educational digital twin of a transmission network: switching, AC power flow, N-1 and cascade analysis. Not for operational use.
gridtwin.sessions.max=200
gridtwin.sessions.idle-minutes=30
mp.openapi.filter=dev.gridtwin.api.config.RequiredPropertiesFilter
quarkus.http.filter.shell.matches=/|/index\\.html
quarkus.http.filter.shell.header.Cache-Control=no-cache
quarkus.http.filter.shell.methods=GET,HEAD
quarkus.http.filter.fingerprinted.matches=/[^/]+-[A-Z0-9]{8}\\.(js|css)
quarkus.http.filter.fingerprinted.header.Cache-Control=public, immutable, max-age=31536000
quarkus.http.filter.fingerprinted.methods=GET,HEAD
