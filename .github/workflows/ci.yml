name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Style gate tests
        run: node --test "tools/**/*.test.ts"
      - name: Style gate
        run: node tools/check-style.ts

  scripts:
    runs-on: ubuntu-latest
    env:
      CYPRESS_INSTALL_BINARY: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter gridtwin --filter gridtwin-e2e
      - name: Type check the tooling scripts
        run: pnpm run typecheck:scripts
      - name: Type check the Cypress specs
        run: pnpm --dir e2e run typecheck
      - name: Lint the tooling scripts and the Cypress specs
        run: pnpm run lint:scripts

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Format, lint, unit, validation and integration tests, coverage
        run: ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@v7
        with:
          name: jacoco-csv
          path: '*/target/site/jacoco/jacoco.csv'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'

  licenses:
    runs-on: ubuntu-latest
    env:
      CYPRESS_INSTALL_BINARY: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: pnpm install --frozen-lockfile
      - name: Third-party license list is up to date
        run: tools/licenses.sh --check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter gridtwin-web...
      - name: Lint
        run: pnpm --dir web run lint
      - name: Type check
        run: pnpm --dir web run typecheck
      - name: Unit tests and coverage
        run: pnpm --dir web run test:ci
      - name: Production build
        run: pnpm --dir web run build
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: web-coverage
          path: web/coverage/
          if-no-files-found: ignore

  coverage:
    needs: [java, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          name: jacoco-csv
          path: .
      - uses: actions/download-artifact@v8
        with:
          name: web-coverage
          path: web/coverage
      - name: The committed badge matches the measured coverage
        run: |
          node tools/coverage-badge.ts
          git diff --exit-code docs/badges/coverage.svg

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Build the application with the web front end inside the jar
        run: tools/build-all.sh
      - name: Cypress against the production build
        run: pnpm --dir e2e run cypress:ci
      - name: Accessibility checks with axe
        run: pnpm --dir e2e run a11y
      - name: Lighthouse accessibility score
        run: pnpm --dir e2e run lighthouse
      - name: Visual checks of the 3D scene
        run: pnpm --dir e2e run visual
      - name: Playwright ffmpeg for the demo video
        run: pnpm --dir e2e exec playwright install ffmpeg
      - name: Demo scenario
        run: pnpm --dir e2e run demo
      - name: Web benchmarks, quick run
        run: tools/bench.sh web --quick
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-output
          path: |
            e2e/a11y/out/
            e2e/lighthouse/out/
            e2e/visual/out/
            e2e/demo/out/
            bench/results/web-*.json
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: docker/setup-buildx-action@v4
      - name: Start the compose stack
        run: docker compose up --build --wait --wait-timeout 180
      - name: Smoke test the running container
        run: node tools/smoke-api.ts http://127.0.0.1:18400
      - name: Show the container log on failure
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  changes:
    runs-on: ubuntu-latest
    outputs:
      references: ${{ steps.filter.outputs.references }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          paths=(tools/reference/ cases/src/main/resources/cases/ validation/src/test/resources/reference/)
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "references=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE" HEAD -- "${paths[@]}"; then
            echo "references=false" >> "$GITHUB_OUTPUT"
          else
            echo "references=true" >> "$GITHUB_OUTPUT"
          fi

  references:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.references == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Regenerate the references and compare them with the committed files
        run: tools/reference/run.sh --check all
